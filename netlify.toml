[build]
  publish = "."

# Garantir cabeçalhos adequados para o download direto do APK no Android
[[headers]]
  for = "/fiomar_Fiomar.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"fiomar_Fiomar.apk\""
    Cache-Control = "public, max-age=86400"

# Otimização de streaming e cache para os vídeos tutoriais
[[headers]]
  for = "/videos-SAV/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para imagens e ativos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Cabeçalhos globais de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
